<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"/>
<title>INFINITE ANiMES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3019984088199024" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#050508;--bg-2:#0a0a12;--bg-3:#0f0f1a;--surface:rgba(255,255,255,0.03);
  --glass:rgba(20,20,35,0.55);--accent:#e50914;--accent-2:#ff2d55;--accent-glow:rgba(229,9,20,0.45);
  --gold:#ffb800;--gold-glow:rgba(255,184,0,0.35);--text-primary:#ffffff;--text-secondary:#a0a0b8;
  --text-muted:#6a6a82;--border:rgba(255,255,255,0.06);--border-hover:rgba(255,255,255,0.14);
  --success:#34c759;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-full:999px;
  --transition-fast:0.2s cubic-bezier(0.25,0.46,0.45,0.94);--transition-base:0.35s cubic-bezier(0.25,0.46,0.45,0.94);
  --transition-slow:0.6s cubic-bezier(0.25,0.46,0.45,0.94);--shadow-sm:0 4px 12px rgba(0,0,0,0.3);
  --shadow-md:0 8px 32px rgba(0,0,0,0.45);--shadow-lg:0 24px 64px rgba(0,0,0,0.6);
  --shadow-glow:0 0 40px rgba(229,9,20,0.25);--shadow-gold:0 0 40px rgba(255,184,0,0.18);
  --font-display:'Bebas Neue',sans-serif;--font-heading:'Poppins',sans-serif;--font-body:'Inter',sans-serif;
  --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text-primary);font-family:var(--font-body);overflow-x:hidden;scroll-behavior:smooth;-webkit-font-smoothing:antialiased;scrollbar-width:none}
::-webkit-scrollbar{display:none}

.mesh-bg{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden}
.mesh-blob{display:none}
.mesh-blob:nth-child(1){width:600px;height:600px;background:radial-gradient(circle,rgba(229,9,20,0.35),transparent 65%);top:-10%;left:-5%;animation:blobDrift1 25s ease-in-out infinite alternate}
.mesh-blob:nth-child(2){width:500px;height:500px;background:radial-gradient(circle,rgba(255,45,85,0.2),transparent 65%);top:20%;right:-8%;animation:blobDrift2 30s ease-in-out infinite alternate}
.mesh-blob:nth-child(3){width:700px;height:700px;background:radial-gradient(circle,rgba(100,50,180,0.22),transparent 65%);bottom:-15%;left:30%;animation:blobDrift3 28s ease-in-out infinite alternate}
.mesh-blob:nth-child(4){width:350px;height:350px;background:radial-gradient(circle,rgba(255,184,0,0.12),transparent 65%);top:60%;left:-3%;animation:blobDrift4 22s ease-in-out infinite alternate}
@keyframes blobDrift1{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(60px,40px,0) scale(1.15)}}
@keyframes blobDrift2{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-50px,60px,0) scale(1.2)}}
@keyframes blobDrift3{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(40px,-40px,0) scale(1.1)}}
@keyframes blobDrift4{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(30px,-30px,0) scale(1.25)}}
.noise-overlay{display:none;pointer-events:none;opacity:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");background-repeat:repeat;background-size:256px}

.glass{background:var(--glass);backdrop-filter:blur(32px) saturate(200%);-webkit-backdrop-filter:blur(32px) saturate(200%);border:1px solid var(--border)}
.glass-hover{transition:var(--transition-base)}
.glass-hover:hover{border-color:var(--border-hover);background:rgba(30,30,50,0.6)}
.glow-red{box-shadow:var(--shadow-glow),inset 0 1px 0 rgba(255,255,255,0.04)}
.glow-gold{box-shadow:var(--shadow-gold),inset 0 1px 0 rgba(255,255,255,0.04)}
.hidden{display:none !important}

.skel{background:linear-gradient(90deg,rgba(255,255,255,0.03) 0%,rgba(255,255,255,0.1) 25%,rgba(255,255,255,0.03) 50%,rgba(255,255,255,0.1) 75%,rgba(255,255,255,0.03) 100%);background-size:300% 100%;animation:skeletonShimmer 1.2s ease-in-out infinite;border-radius:var(--radius-md)}
@keyframes skeletonShimmer{0%{background-position:150% 0}100%{background-position:-150% 0}}
.skel-card{aspect-ratio:2/3}

.btn-base{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--radius-md);font-family:var(--font-heading);font-weight:600;cursor:pointer;transition:var(--transition-base);will-change:transform;white-space:nowrap;font-size:0.92rem;letter-spacing:0.02em}
.btn-base:active{transform:scale(0.96)}
.btn-primary{padding:14px 28px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:0.95rem;box-shadow:0 6px 24px rgba(229,9,20,0.35);position:relative;overflow:hidden}
.btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,0.2),transparent 60%);transform:translateX(-100%);transition:var(--transition-slow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(229,9,20,0.5)}
.btn-primary:hover::before{transform:translateX(100%)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.btn-secondary{padding:12px 22px;background:rgba(255,255,255,0.05);color:var(--text-primary);border:1px solid var(--border);font-size:0.88rem}
.btn-secondary:hover{background:rgba(255,255,255,0.1);border-color:var(--border-hover);transform:translateY(-1px)}

/* Intro */
#intro{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s ease,visibility 0.8s ease;visibility:visible}
#intro.fade-out{opacity:0;visibility:hidden;pointer-events:none}
#intro.done{display:none}
.intro-brand{font-family:var(--font-display);font-size:clamp(3rem,10vw,6.5rem);font-weight:400;letter-spacing:0.1em;color:var(--accent);text-transform:uppercase;opacity:0;transform:scale(0.85) translateY(20px);animation:introBrandIn 0.8s 0.2s cubic-bezier(0.2,0.8,0.2,1) forwards;text-shadow:0 0 60px rgba(229,9,20,0.4),0 0 120px rgba(229,9,20,0.15);white-space:nowrap}
@keyframes introBrandIn{to{opacity:1;transform:scale(1) translateY(0)}}
.intro-tagline{font-family:var(--font-heading);color:var(--text-secondary);font-size:0.85rem;letter-spacing:0.5em;text-transform:uppercase;margin-top:32px;opacity:0;animation:introTaglineIn 0.6s 1s forwards;font-weight:500}
@keyframes introTaglineIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#skipBtn{position:absolute;bottom:calc(28px + var(--safe-bottom));right:28px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:var(--text-secondary);border-radius:var(--radius-full);padding:10px 22px;cursor:pointer;font-family:var(--font-heading);font-size:0.82rem;font-weight:500;transition:var(--transition-base);backdrop-filter:blur(12px);z-index:10}
#skipBtn:hover{background:rgba(255,255,255,0.12);color:#fff;border-color:rgba(255,255,255,0.3)}

/* App Shell */
#app{display:none;opacity:0;animation:appEnter 0.5s 0.1s forwards}
@keyframes appEnter{from{opacity:0}to{opacity:1}}

.top-bar{position:fixed;top:0;left:0;right:0;z-index:999;height:calc(64px + var(--safe-top));padding:calc(12px + var(--safe-top)) 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,rgba(5,5,8,0.98) 0%,rgba(5,5,8,0.88) 70%,rgba(5,5,8,0) 100%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(255,255,255,0.04)}
.brand{font-family:var(--font-display);font-size:1.1rem;font-weight:400;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;letter-spacing:0.04em;cursor:pointer;display:flex;align-items:center;gap:6px}
.brand::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:brandDotPulse 2s ease-in-out infinite}
@keyframes brandDotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(0.8)}}

.top-right{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);object-fit:cover;cursor:pointer;box-shadow:0 0 16px rgba(229,9,20,0.3)}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:999;height:calc(72px + var(--safe-bottom));padding:8px 12px calc(8px + var(--safe-bottom));display:flex;align-items:center;justify-content:space-around;gap:4px;background:rgba(5,5,8,0.92);backdrop-filter:blur(32px);border-top:1px solid rgba(255,255,255,0.06)}
.nav-tab{border:none;background:transparent;color:var(--text-muted);border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0.6rem;gap:4px;cursor:pointer;font-family:var(--font-heading);font-weight:500;padding:8px 6px;flex:1;max-width:80px}
.nav-tab svg{width:22px;height:22px;stroke-width:2;stroke:var(--text-muted)}
.nav-tab.active{color:#fff;background:rgba(255,255,255,0.05)}
.nav-tab.active svg{stroke:#fff}

.page{display:none;padding:calc(80px + env(safe-area-inset-top)) 0 calc(88px + env(safe-area-inset-bottom));min-height:100vh}
.page.active{display:block}

.sec-head{display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px;margin-bottom:18px}
.sec-title{font-family:var(--font-display);font-size:1.9rem;letter-spacing:0.06em;display:flex;align-items:center;gap:10px;line-height:1}
.sec-title::before{content:'';width:4px;height:28px;background:linear-gradient(180deg,var(--accent),var(--gold));border-radius:var(--radius-full)}

.anime-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 12px}
@media(min-width:480px){.anime-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.anime-grid{grid-template-columns:repeat(4,1fr);gap:12px}}
@media(min-width:1000px){.anime-grid{grid-template-columns:repeat(5,1fr)}}

.card{position:relative;border-radius:var(--radius-md);overflow:hidden;cursor:pointer;background:var(--bg-2);border:1px solid var(--border);aspect-ratio:2/3;box-shadow:var(--shadow-sm);transition:transform 0.2s ease}
.card:hover{transform:scale(1.04);z-index:2}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(5,5,8,0.98) 0%,rgba(5,5,8,0.7) 40%,transparent);padding:30px 10px 10px;z-index:3}
.card-title{font-size:0.85rem;font-weight:700;line-height:1.25;color:#fff;font-family:var(--font-heading)}

/* Player Page */
#playerPage{padding:calc(60px + env(safe-area-inset-top)) 0 calc(88px + env(safe-area-inset-bottom))}
.player-hero{position:relative;width:100%;background:#000;aspect-ratio:16/9;min-height:220px}
.player-hero iframe{width:100%;height:100%;border:none;display:block}
.player-meta{padding:24px 16px}
.player-title{font-family:var(--font-display);font-size:2.2rem;letter-spacing:0.02em;margin-bottom:12px;color:#fff}

/* Episodes */
.ep-section{margin:0 16px 32px}
.ep-header{font-family:var(--font-display);font-size:1.8rem;letter-spacing:0.08em;margin-bottom:18px}
.ep-list{display:flex;flex-direction:column;gap:8px}
.ep-card{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;transition:0.2s}
.ep-card:hover{background:var(--bg-3);border-color:var(--accent)}
.ep-title{font-size:0.95rem;font-weight:600;font-family:var(--font-heading);color:#fff}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(15,15,28,0.98);border:1px solid var(--border);color:#fff;padding:14px 30px;border-radius:var(--radius-md);font-size:0.92rem;z-index:1000;opacity:0;transition:0.3s;pointer-events:none;font-family:var(--font-heading);box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="mesh-bg" aria-hidden="true"></div>

<!-- INTRO -->
<div id="intro">
  <div class="intro-brand">INFINITE ANiMES</div>
  <div class="intro-tagline">Stream &middot; Discover &middot; Obsess</div>
  <button id="skipBtn">Skip Intro</button>
</div>

<script>
(function(){
  function hideIntro(){
    var el = document.getElementById('intro');
    if(!el) return;
    el.style.opacity = '0';
    el.style.visibility = 'hidden';
    setTimeout(function(){ el.style.display = 'none'; document.getElementById('app').style.display = 'block'; document.getElementById('app').style.opacity = '1'; }, 800);
  }
  setTimeout(hideIntro, 1200);
  var skipBtn = document.getElementById('skipBtn');
  if(skipBtn) skipBtn.addEventListener('click', hideIntro);
})();
</script>

<!-- APP SHELL -->
<div id="app">
  <div class="top-bar">
    <div class="brand" onclick="setPage('homePage')">INFINITE ANiMES</div>
    <div class="top-right">
      <img class="avatar" id="userAvatar" src="https://ui-avatars.com/api/?name=Otaku&background=ff004c&color=fff" alt="Profile" onclick="setPage('profilePage')">
    </div>
  </div>

  <!-- HOME PAGE -->
  <div class="page active" id="homePage">
    <div class="sec-head" style="margin-top:10px">
      <div class="sec-title">Trending Catalog</div>
    </div>
    <div class="anime-grid" id="mainGrid">
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
    </div>
  </div>

  <!-- SEARCH PAGE -->
  <div class="page" id="searchPage">
    <div class="sec-head"><div class="sec-title">Search Anime</div></div>
  </div>

  <!-- LIBRARY PAGE -->
  <div class="page" id="libPage">
    <div class="sec-head"><div class="sec-title">My Library</div></div>
    <div class="anime-grid" id="libGrid">
      <p style="color:var(--text-muted);padding:20px;grid-column:1/-1;">No saved anime yet.</p>
    </div>
  </div>

  <!-- PROFILE PAGE -->
  <div class="page" id="profilePage">
    <div class="sec-head"><div class="sec-title">My Profile</div></div>
  </div>

  <!-- PLAYER PAGE -->
  <div class="page" id="playerPage">
    <div class="player-hero">
      <div id="playerFrame" style="width:100%;height:100%;display:grid;place-items:center;background:#111;color:#666;font-family:var(--font-heading);">Select an episode to play</div>
    </div>
    <div class="player-meta">
      <div class="player-title" id="pTitle">Select an Anime</div>
      <div id="pSynopsis" style="color:var(--text-secondary);font-size:0.88rem;line-height:1.6"></div>
    </div>
    <div class="ep-section" id="pEpisodeSection">
      <div class="ep-header">Episodes</div>
      <div class="ep-list" id="pEpisodeList">
        <p style="color:var(--text-muted);font-size:0.9rem;">Loading episodes...</p>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav">
    <button class="nav-tab active" data-p="homePage" onclick="setPage(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      Home
    </button>
    <button class="nav-tab" data-p="searchPage" onclick="setPage(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      Search
    </button>
    <button class="nav-tab" data-p="libPage" onclick="setPage(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      Library
    </button>
    <button class="nav-tab" data-p="profilePage" onclick="setPage(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      Profile
    </button>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<!-- BACKEND API INTEGRATION SCRIPT -->
<script>
const API_BASE = "https://parshya321-production.up.railway.app";

function toast(msg) {
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.className = 'toast show';
  setTimeout(() => el.className = 'toast', 3000);
}

function setPage(btnOrId) {
  const id = typeof btnOrId === 'string' ? btnOrId : btnOrId.dataset?.p;
  if (!id) return;
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === id));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.p === id));
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// 1. Load Catalog from Railway Backend
async function loadCatalog() {
  const grid = document.getElementById('mainGrid');
  try {
    const res = await fetch(`${API_BASE}/api/anime/catalog`);
    const data = await res.json();
    
    if (data.status === "success" && data.items.length > 0) {
      grid.innerHTML = data.items.map(anime => `
        <div class="card" onclick="openAnime('${anime.url}', '${escapeHtml(anime.title)}', '${anime.thumbnail}')">
          <img src="${anime.thumbnail || 'https://via.placeholder.com/150'}" alt="${escapeHtml(anime.title)}" loading="lazy">
          <div class="card-overlay">
            <div class="card-title">${escapeHtml(anime.title)}</div>
          </div>
        </div>
      `).join('');
    } else {
      grid.innerHTML = `<p style="color:var(--text-secondary);padding:20px;grid-column:1/-1;">No anime found.</p>`;
    }
  } catch (err) {
    console.error("Catalog error:", err);
    grid.innerHTML = `<p style="color:var(--accent);padding:20px;grid-column:1/-1;">Failed to connect to backend server.</p>`;
  }
}

// 2. Open Anime & Fetch Episodes
async function openAnime(animeUrl, title, thumbnail) {
  setPage('playerPage');
  document.getElementById('pTitle').textContent = title;
  document.getElementById('pSynopsis').textContent = "Fetching available episodes from live scraper...";
  
  const epList = document.getElementById('pEpisodeList');
  epList.innerHTML = `<p style="color:var(--text-secondary);">Loading episodes...</p>`;

  try {
    const res = await fetch(`${API_BASE}/api/anime/episodes?url=${encodeURIComponent(animeUrl)}`);
    const data = await res.json();

    if (data.status === "success" && data.episodes.length > 0) {
      document.getElementById('pSynopsis').textContent = `Total Episodes found: ${data.episodes.length}. Click any episode below to start streaming instantly!`;
      epList.innerHTML = data.episodes.map((ep, idx) => `
        <div class="ep-card" onclick="playEpisode('${ep.url}', '${escapeHtml(ep.title)}')">
          <div class="ep-title">${escapeHtml(ep.title || 'Episode ' + (idx + 1))}</div>
          <span style="color:var(--accent);font-size:0.8rem;font-family:var(--font-heading);font-weight:600;">PLAY ▶</span>
        </div>
      `).join('');
    } else {
      epList.innerHTML = `<p style="color:var(--text-secondary);">No episodes found for this anime.</p>`;
    }
  } catch (err) {
    console.error("Episodes error:", err);
    epList.innerHTML = `<p style="color:var(--accent);">Failed to load episodes.</p>`;
  }
}

// 3. Resolve & Play Episode Stream
async function playEpisode(episodeUrl, epTitle) {
  toast("Resolving live stream link...");
  const frame = document.getElementById('playerFrame');
  frame.innerHTML = `<p style="color:var(--gold);">Fetching stream source...</p>`;

  try {
    const res = await fetch(`${API_BASE}/api/anime/resolve?url=${encodeURIComponent(episodeUrl)}`);
    const result = await res.json();

    if (result.stream_url) {
      toast("Stream loaded successfully!");
      frame.innerHTML = `<iframe src="${result.stream_url}" allowfullscreen webkitallowfullscreen style="width:100%;height:100%;border:none;" allow="autoplay; fullscreen; encrypted-media"></iframe>`;
    } else {
      toast("Could not resolve stream.");
      frame.innerHTML = `<p style="color:var(--accent);">Stream link unavailable.</p>`;
    }
  } catch (err) {
    console.error("Resolve error:", err);
    toast("Error resolving stream.");
    frame.innerHTML = `<p style="color:var(--accent);">Failed to load player.</p>`;
  }
}

function escapeHtml(str) {
  return str ? str.replace(/'/g, "&#39;").replace(/"/g, "&quot;") : '';
}

// Initialize Catalog on Load
loadCatalog();
</script>

</body>
</html>
